---
layout: default
---
<article class="page-shell">
  <header class="page-header">
    {% if page.section %}<p class="eyebrow">{{ page.section }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.intro %}<p class="page-intro">{{ page.intro }}</p>{% endif %}
  </header>
  <div class="prose">{{ content }}</div>
</article>
